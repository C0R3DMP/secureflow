<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFlow — Security Assessment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        header {
            grid-column: 1 / -1;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        input:invalid {
            border-color: var(--accent-red);
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: var(--accent-blue);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            background: #79c0ff;
            border-color: var(--accent-blue);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-idle {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .status-running {
            background: rgba(212, 153, 34, 0.2);
            color: var(--accent-yellow);
        }

        .status-success {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .status-error {
            background: rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
        }

        .timer {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .phases-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .phase {
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: 4px;
            transition: all 0.2s;
        }

        .phase.running {
            border-left-color: var(--accent-yellow);
            background: rgba(212, 153, 34, 0.1);
        }

        .phase.completed {
            border-left-color: var(--accent-green);
            background: rgba(63, 185, 80, 0.1);
        }

        .phase.error {
            border-left-color: var(--accent-red);
            background: rgba(248, 81, 73, 0.1);
        }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .phase-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .phase-title {
            font-weight: 600;
            font-size: 13px;
            flex: 1;
        }

        .phase-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            transition: width 0.3s ease;
            width: 0%;
        }

        .phase.completed .progress-fill {
            background: var(--accent-green);
            width: 100%;
        }

        .phase.error .progress-fill {
            background: var(--accent-red);
            width: 100%;
        }

        .agent-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .agent-icon {
            font-size: 14px;
        }

        .agent-name {
            font-weight: 600;
            color: var(--accent-blue);
        }

        .terminal {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.4;
            margin-top: 20px;
        }

        .log-line {
            display: flex;
            gap: 8px;
            margin-bottom: 2px;
        }

        .log-time {
            color: var(--text-secondary);
            flex-shrink: 0;
            min-width: 90px;
        }

        .log-message {
            flex: 1;
            word-break: break-word;
        }

        .log-error {
            color: var(--accent-red);
        }

        .log-success {
            color: var(--accent-green);
        }

        .log-info {
            color: var(--accent-blue);
        }

        .log-warning {
            color: var(--accent-yellow);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 600px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .history-item:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: var(--accent-blue);
        }

        .history-target {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .history-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
        }

        .history-success {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .history-error {
            background: rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
        }

        .message-box {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            border: 1px solid var(--border);
            display: none;
        }

        .message-box.show { display: block; }
        .message-box.error { background: rgba(248, 81, 73, 0.1); border-color: var(--accent-red); color: var(--accent-red); }
        .message-box.success { background: rgba(63, 185, 80, 0.1); border-color: var(--accent-green); color: var(--accent-green); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .terminal {
                max-height: 300px;
            }

            .history-list {
                max-height: 300px;
            }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--accent-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 SecureFlow</h1>
            <p class="header-subtitle">AI-Powered Security Assessment Platform</p>
        </header>

        <!-- Main Content Panel -->
        <div class="panel">
            <h2>Security Scan</h2>

            <div class="message-box" id="messageBox"></div>

            <!-- Form -->
            <form id="scanForm">
                <div class="form-group">
                    <label for="target">Target (IP/Domain/URL)</label>
                    <input
                        type="text"
                        id="target"
                        name="target"
                        placeholder="e.g., scanme.nmap.org"
                        pattern="[a-zA-Z0-9\-\.]+(\.[a-zA-Z0-9\-\.]+)*|^(\d{1,3}\.){3}\d{1,3}$"
                        required
                        title="Enter a valid domain, URL, or IP address"
                    >
                </div>

                <button type="submit" class="btn" id="startBtn">
                    ▶ Start Scan
                </button>
            </form>

            <!-- Status Display -->
            <div class="status-display" id="statusDisplay" style="display: none;">
                <span class="status-badge status-idle" id="statusBadge">Idle</span>
                <span class="timer" id="timer">00:00</span>
            </div>

            <!-- Phases -->
            <div class="phases-container" id="phasesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <p>No scan in progress</p>
                </div>
            </div>

            <!-- Agent Indicator -->
            <div class="agent-indicator" id="agentIndicator" style="display: none;">
                <span class="agent-icon" id="agentIcon">🤖</span>
                <span class="agent-name" id="agentName">Waiting...</span>
            </div>

            <!-- Terminal Output -->
            <div class="terminal" id="terminal" style="display: none;"></div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <h2>Scan History</h2>
                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No scans yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiBase: window.location.origin,
            sseTimeout: 300000,
            historyRefreshInterval: 5000
        };

        const AGENTS = {
            recon: { icon: '🔍', name: 'Recon Agent', color: '#d29922' },
            analyst: { icon: '🔬', name: 'Analyst Agent', color: '#58a6ff' },
            reporter: { icon: '📊', name: 'Reporter Agent', color: '#3fb950' }
        };

        let state = {
            scanning: false,
            currentTarget: null,
            startTime: null,
            timerInterval: null,
            phases: {
                'Reconnaissance': { status: 'pending', progress: 0, agent: 'recon' },
                'Vulnerability Analysis': { status: 'pending', progress: 0, agent: 'analyst' },
                'Report Generation': { status: 'pending', progress: 0, agent: 'reporter' }
            },
            logs: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            loadHistory();
            setInterval(loadHistory, CONFIG.historyRefreshInterval);
        });

        function setupEventListeners() {
            document.getElementById('scanForm').addEventListener('submit', startScan);
        }

        async function startScan(e) {
            e.preventDefault();
            if (state.scanning) return;

            const target = document.getElementById('target').value.trim();
            if (!target) {
                showMessage('Please enter a target', 'error');
                return;
            }

            // Validate target
            if (!isValidTarget(target)) {
                showMessage('Invalid target. Use domain, URL, or IP address.', 'error');
                return;
            }

            state.scanning = true;
            state.currentTarget = target;
            state.startTime = Date.now();
            state.phases = {
                'Reconnaissance': { status: 'pending', progress: 0, agent: 'recon' },
                'Vulnerability Analysis': { status: 'pending', progress: 0, agent: 'analyst' },
                'Report Generation': { status: 'pending', progress: 0, agent: 'reporter' }
            };
            state.logs = [];

            document.getElementById('startBtn').disabled = true;
            document.getElementById('target').disabled = true;
            document.getElementById('statusDisplay').style.display = 'flex';
            document.getElementById('terminal').style.display = 'block';
            document.getElementById('agentIndicator').style.display = 'flex';

            updateStatus('running');
            updatePhases();
            startTimer();

            try {
                startSSEStream(target);
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
                resetUI();
            }
        }

        function isValidTarget(target) {
            // IP validation
            const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (ipRegex.test(target)) return true;

            // Domain/URL validation
            const domainRegex = /^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
            return domainRegex.test(target);
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const seconds = String(elapsed % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            }, 100);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
            }
        }

        function startSSEStream(target) {
            const eventSource = new EventSource(`${CONFIG.apiBase}/stream/${encodeURIComponent(target)}`);

            eventSource.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.event === 'start') {
                        addLog(`Starting scan of ${data.target}`, 'info');
                    } else if (data.event === 'phase_complete') {
                        const phaseName = data.phase;
                        if (state.phases[phaseName]) {
                            state.phases[phaseName].status = 'completed';
                            state.phases[phaseName].progress = 100;
                            addLog(`✓ ${phaseName} complete`, 'success');
                        }
                        updatePhases();
                    } else if (data.event === 'complete') {
                        addLog('✅ Scan completed successfully!', 'success');
                        updateStatus('success');
                        stopTimer();
                        resetScan();
                        loadHistory();
                    } else if (data.event === 'error') {
                        addLog(`❌ Error: ${data.message || 'Unknown error'}`, 'error');
                        updateStatus('error');
                        stopTimer();
                        resetScan();
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            });

            eventSource.addEventListener('error', () => {
                if (state.scanning) {
                    addLog('Connection lost', 'error');
                    updateStatus('error');
                }
                eventSource.close();
                stopTimer();
                resetScan();
            });

            setTimeout(() => {
                if (state.scanning) {
                    eventSource.close();
                    stopTimer();
                    resetScan();
                }
            }, CONFIG.sseTimeout);
        }

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            state.logs.push({ timestamp, message, type });

            const terminal = document.getElementById('terminal');
            const logLine = document.createElement('div');
            logLine.className = `log-line log-${type}`;
            logLine.innerHTML = `<span class="log-time">[${timestamp}]</span><span class="log-message">${escapeHtml(message)}</span>`;
            terminal.appendChild(logLine);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function updateStatus(status) {
            const badge = document.getElementById('statusBadge');
            badge.className = `status-badge status-${status}`;
            badge.textContent = {
                idle: 'Idle',
                running: '🔄 Running',
                success: '✓ Success',
                error: '✗ Error'
            }[status] || 'Unknown';
        }

        function updatePhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            Object.entries(state.phases).forEach(([name, phase]) => {
                const agent = AGENTS[phase.agent] || {};
                const phaseEl = document.createElement('div');
                phaseEl.className = `phase ${phase.status}`;

                const statusIcon = {
                    'pending': '◯',
                    'running': '<span class="spinner"></span>',
                    'completed': '✓',
                    'error': '✗'
                }[phase.status] || '?';

                phaseEl.innerHTML = `
                    <div class="phase-header">
                        <span class="phase-icon">${statusIcon}</span>
                        <span class="phase-title">${name}</span>
                        <span class="phase-status">${phase.status}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${phase.progress}%"></div>
                    </div>
                `;

                container.appendChild(phaseEl);
            });

            // Update agent indicator
            const currentPhase = Object.entries(state.phases).find(([_, p]) => p.status === 'running');
            if (currentPhase) {
                const agent = AGENTS[currentPhase[1].agent];
                document.getElementById('agentIcon').textContent = agent.icon;
                document.getElementById('agentName').textContent = agent.name;
                document.getElementById('agentIndicator').style.display = 'flex';
            }
        }

        function resetScan() {
            state.scanning = false;
            state.currentTarget = null;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('target').disabled = false;
        }

        function resetUI() {
            resetScan();
            updateStatus('idle');
            stopTimer();
            document.getElementById('statusDisplay').style.display = 'none';
            document.getElementById('phasesContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <p>No scan in progress</p>
                </div>
            `;
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('agentIndicator').style.display = 'none';
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${CONFIG.apiBase}/api/history`);
                if (!response.ok) throw new Error('Failed to load history');

                const data = await response.json();
                const historyList = document.getElementById('historyList');

                if (!data.sessions || data.sessions.length === 0) {
                    historyList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>No scans yet</p>
                        </div>
                    `;
                    return;
                }

                historyList.innerHTML = data.sessions.map(session => {
                    const date = new Date(session.timestamp);
                    const timeStr = date.toLocaleString();
                    const statusClass = `history-${session.status}`;

                    return `
                        <div class="history-item">
                            <div class="history-target">🎯 ${escapeHtml(session.target)}</div>
                            <div class="history-time">${timeStr}</div>
                            <span class="history-status ${statusClass}">${session.status.toUpperCase()}</span>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function showMessage(message, type) {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.className = `message-box show ${type}`;
            setTimeout(() => box.classList.remove('show'), 4000);
        }
    </script>
</body>
</html>
